<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('inicio') }}">Inicio</a>
        <a href="{{ url_for('estudiantes') }}">Estudiantes</a>
        <a href="{{ url_for('contacto') }}" class="activo">Contacto</a>
    </nav>

    <main>
        <h1>Página de contacto</h1>

        {% if mensaje_enviado %}
        <p class="exito">{{ mensaje_enviado }}</p>
        {% endif %}

        <form id="form-contacto" method="POST" action="{{ url_for('contacto') }}">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
